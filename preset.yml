schema_version: "1.0"

preset:
  id: "speckit-skald-sync"
  name: "Spec Kit ↔ Skald Sync (Basic)"
  version: "0.2.0"
  description: "Two-way sync between the Spec Kit flow and Skald (the PM source of truth). One PBI = one Spec Kit feature: the core commands gain Skald sync appends (requirements, open questions, status lifecycle, release/goal links), plus nine optional commands covering the wider Skald surface (vision, domain knowledge, design handoff, goals, releases, backlog refinement, requirements workshop, product health)."
  author: "Skald"
  repository: "https://github.com/SmidigStorm/speckit-skald-sync"
  license: "MIT"

requires:
  speckit_version: ">=0.6.0"

provides:
  templates:
    # --- appends to the core flow ---
    - type: "command"
      name: "speckit.specify"
      file: "commands/speckit.specify.md"
      description: "Resolve/create the ONE feature PBI, adopt-or-create linked requirements + rules + examples, open questions, release + goal link, traceability"
      replaces: "speckit.specify"
      strategy: "append"
    - type: "command"
      name: "speckit.clarify"
      file: "commands/speckit.clarify.md"
      description: "Sync answered/new open questions, update rules/examples, spec-approval transition (Requirements Approved, PBI Ready for Planning)"
      replaces: "speckit.clarify"
      strategy: "append"
    - type: "command"
      name: "speckit.plan"
      file: "commands/speckit.plan.md"
      description: "Catch-up approval guard, open questions, Blocked requirements, plan summary appended to the PBI description"
      replaces: "speckit.plan"
      strategy: "append"
    - type: "command"
      name: "speckit.tasks"
      file: "commands/speckit.tasks.md"
      description: "Annotate tasks.md with PB-x and the story→requirement map; no status change"
      replaces: "speckit.tasks"
      strategy: "append"
    - type: "command"
      name: "speckit.analyze"
      file: "commands/speckit.analyze.md"
      description: "Read-only two-way drift report between the spec artefacts and Skald"
      replaces: "speckit.analyze"
      strategy: "append"
    - type: "command"
      name: "speckit.implement"
      file: "commands/speckit.implement.md"
      description: "PBI In Progress at start, per-story Requirement Delivered on green checkpoints, PBI Done on a green gate"
      replaces: "speckit.implement"
      strategy: "append"
    # --- new optional commands ---
    - type: "command"
      name: "speckit.specify-vision"
      file: "commands/speckit.specify-vision.md"
      description: "New command: draft/refine the project Vision and User groups"
      strategy: "replace"
    - type: "command"
      name: "speckit.domain-knowledge"
      file: "commands/speckit.domain-knowledge.md"
      description: "New command: entities/processes/terms — feature mode (from the spec) or standalone domain discovery"
      strategy: "replace"
    - type: "command"
      name: "speckit.design-brief"
      file: "commands/speckit.design-brief.md"
      description: "New command: generate a paste-ready Claude Design brief for the feature"
      strategy: "replace"
    - type: "command"
      name: "speckit.design-read"
      file: "commands/speckit.design-read.md"
      description: "New command: intake a returned design handoff — drift-check (repo wins), scope-check, question writeback"
      strategy: "replace"
    - type: "command"
      name: "speckit.goals"
      file: "commands/speckit.goals.md"
      description: "New command: author and track OKRs — time periods, objectives, key results, weekly check-ins"
      strategy: "replace"
    - type: "command"
      name: "speckit.release-planning"
      file: "commands/speckit.release-planning.md"
      description: "New command: manage releases — contents, dates, Planned→In Progress→Released, moving PBIs"
      strategy: "replace"
    - type: "command"
      name: "speckit.backlog-refinement"
      file: "commands/speckit.backlog-refinement.md"
      description: "New command: create/split/size/gap-check PBIs until one is ready for /speckit-specify"
      strategy: "replace"
    - type: "command"
      name: "speckit.requirements-workshop"
      file: "commands/speckit.requirements-workshop.md"
      description: "New command: standalone Spec-by-Example workshop on one requirement"
      strategy: "replace"
    - type: "command"
      name: "speckit.product-health"
      file: "commands/speckit.product-health.md"
      description: "New command: read-only full-product health scan with routed next steps"
      strategy: "replace"

tags:
  - "skald"
  - "pm"
  - "mcp"
  - "traceability"
